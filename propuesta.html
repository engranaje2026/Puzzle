<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan de Trabajo — Planilla Sinergia</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .card {
    background: #131b2e;
    border: 1px solid #3a4568;
    border-radius: 12px;
    padding: 24px;
    margin-top: 15px;
  }
  .feedback-box {
    background: #1a2744;
    border-left: 4px solid #c6a15b;
    padding: 16px;
    border-radius: 6px;
    margin-bottom: 20px;
  }
  .feedback-title {
    color: #c6a15b;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .feedback-body {
    color: #e0e0e0;
    font-size: 14px;
    line-height: 1.5;
  }
  .feedback-meta {
    font-size: 11px;
    color: #8a99ad;
    margin-top: 8px;
  }
  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #c6a15b;
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    box-sizing: border-box;
    background: #0c1120;
    border: 1px solid #3a4568;
    color: #fff;
    padding: 10px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  .field textarea {
    resize: vertical;
    min-height: 130px;
    line-height: 1.5;
  }
  .field select option {
    background: #0c1120;
    color: #fff;
  }
  .status-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .status-saved { background: #142918; color: #51cf66; border: 1px solid #205a28; }
</style>
</head>
<body>
<div class="wrap" id="mainWrap" style="display:none;">
  <div class="eyebrow">Planilla Sinergia</div>
  <h1 id="welcomeUser">Propuesta de Integrante</h1>
  <p class="sub">Selecciona tu área de interés y describe tu proyecto o plan de trabajo.</p>

  <!-- Tarjeta de Retroalimentación del Administrador -->
  <div id="feedbackContainer" style="display:none;" class="feedback-box">
    <div class="feedback-title">Retroalimentación del Administrador</div>
    <div class="feedback-body" id="feedbackText"></div>
    <div class="feedback-meta" id="feedbackDate"></div>
  </div>

  <div class="card">
    <div class="field">
      <label for="nicknameInput">Nombre visible / Alias preferido</label>
      <input type="text" id="nicknameInput" placeholder="Ej. Yrak E.">
    </div>

    <div class="field">
      <label for="carteraSelect">Cartera de tu interés</label>
      <select id="carteraSelect">
        <option value="" disabled selected>Selecciona una cartera o comisión...</option>
        <optgroup label="Secretaría General">
          <option value="Secretaría General">Secretaría General</option>
        </optgroup>
        <optgroup label="Secretarías Operativas">
          <option value="Secretaría de Trabajo (Titular)">Secretaría de Trabajo (Titular)</option>
          <option value="Secretaría de Trabajo (Suplente)">Secretaría de Trabajo (Suplente)</option>
          <option value="Secretaría de Previsión Social (Titular)">Secretaría de Previsión Social (Titular)</option>
          <option value="Secretaría de Previsión Social (Suplente)">Secretaría de Previsión Social (Suplente)</option>
          <option value="Secretaría de Organización (Titular)">Secretaría de Organización (Titular)</option>
          <option value="Secretaría de Organización (Suplente)">Secretaría de Organización (Suplente)</option>
          <option value="Secretaría de Finanzas (Titular)">Secretaría de Finanzas (Titular)</option>
          <option value="Secretaría de Finanzas (Suplente)">Secretaría de Finanzas (Suplente)</option>
          <option value="Secretaría de Relaciones (Titular)">Secretaría de Relaciones (Titular)</option>
          <option value="Secretaría de Relaciones (Suplente)">Secretaría de Relaciones (Suplente)</option>
          <option value="Secretaría del Interior (Titular)">Secretaría del Interior (Titular)</option>
          <option value="Secretaría del Interior (Suplente)">Secretaría del Interior (Suplente)</option>
        </optgroup>
        <optgroup label="Comisión de Justicia">
          <option value="Comisión de Justicia (Presidente)">Comisión de Justicia (Presidente)</option>
          <option value="Comisión de Justicia (Suplente Presidente)">Comisión de Justicia (Suplente Presidente)</option>
          <option value="Comisión de Justicia (Secretario)">Comisión de Justicia (Secretario)</option>
          <option value="Comisión de Justicia (Vocal 1)">Comisión de Justicia (Vocal 1)</option>
          <option value="Comisión de Justicia (Vocal 2)">Comisión de Justicia (Vocal 2)</option>
          <option value="Comisión de Justicia (Vocal 3)">Comisión de Justicia (Vocal 3)</option>
          <option value="Comisión de Justicia (Suplente Vocal 1)">Comisión de Justicia (Suplente Vocal 1)</option>
          <option value="Comisión de Justicia (Suplente Vocal 2)">Comisión de Justicia (Suplente Vocal 2)</option>
          <option value="Comisión de Justicia (Suplente Vocal 3)">Comisión de Justicia (Suplente Vocal 3)</option>
        </optgroup>
      </select>
    </div>

    <div class="field">
      <label for="propuestaInput">Desarrollo de tu propuesta / Plan de trabajo</label>
      <textarea id="propuestaInput" placeholder="Detalla aquí tus objetivos, aportes y plan estratégico para esta área..."></textarea>
    </div>

    <button class="btn primary" id="saveBtn" style="width:100%;">Guardar Propuesta</button>
  </div>

  <footer><a class="plain" href="index.html">Salir / Volver a escanear</a></footer>
</div>

<script>
const SUPABASE_URL = 'https://ngukwfgiyrsxloicixhx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ndWt3ZmdpeXJzeGxvaWNpeGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTQwMTcsImV4cCI6MjEwMjUzMDAxN30.rDnMh6dEPirrm8TVQLaii9Nunr1xVYD9jTQ8Z60MDBs';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const isAuth = sessionStorage.getItem('sinergia_auth');
const userToken = sessionStorage.getItem('sinergia_token');
const userName = sessionStorage.getItem('sinergia_user');

const mainWrap = document.getElementById('mainWrap');
const welcomeUser = document.getElementById('welcomeUser');
const nicknameInput = document.getElementById('nicknameInput');
const carteraSelect = document.getElementById('carteraSelect');
const propuestaInput = document.getElementById('propuestaInput');
const saveBtn = document.getElementById('saveBtn');

const feedbackContainer = document.getElementById('feedbackContainer');
const feedbackText = document.getElementById('feedbackText');
const feedbackDate = document.getElementById('feedbackDate');

async function init() {
  if (!isAuth || !userToken) {
    alert('Acceso no autorizado. Escanea tu pieza para ingresar.');
    window.location.replace('index.html');
    return;
  }

  mainWrap.style.display = 'block';
  welcomeUser.textContent = `Hola, ${userName}`;

  // Consultar datos actuales del integrante
  const { data, error } = await supabaseClient
    .from('pieces')
    .select('*')
    .eq('token', userToken)
    .maybeSingle();

  if (error || !data) {
    console.error('Error al recuperar datos:', error);
    return;
  }

  if (data.nickname) nicknameInput.value = data.nickname;
  if (data.cartera) carteraSelect.value = data.cartera;
  if (data.propuesta) propuestaInput.value = data.propuesta;

  // Si existe retroalimentación, mostrarla
  if (data.feedback && data.feedback.trim() !== '') {
    feedbackText.textContent = data.feedback;
    if (data.feedback_date) {
      const fDate = new Date(data.feedback_date);
      feedbackDate.textContent = `Actualizado el ${fDate.toLocaleDateString()} a las ${fDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    }
    feedbackContainer.style.display = 'block';
  }
}

saveBtn.onclick = async () => {
  const nickname = nicknameInput.value.trim();
  const cartera = carteraSelect.value;
  const propuesta = propuestaInput.value.trim();

  if (!cartera) {
    alert('Por favor selecciona la cartera de tu interés.');
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = 'Guardando...';

  const { error } = await supabaseClient
    .from('pieces')
    .update({
      nickname: nickname || userName,
      cartera: cartera,
      propuesta: propuesta,
      updated_at: new Date().toISOString()
    })
    .eq('token', userToken);

  if (error) {
    alert('Error al guardar: ' + error.message);
  } else {
    alert('¡Propuesta guardada correctamente!');
  }

  saveBtn.disabled = false;
  saveBtn.textContent = 'Guardar Propuesta';
};

init();
</script>
</body>
</html>
