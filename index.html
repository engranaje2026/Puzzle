<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Planilla Sinergia</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Planilla Sinergia</div>
  <h1>Sube tu pieza</h1>
  <p class="sub">Cada integrante recibió una pieza única. Súbela aquí para entrar al espacio del equipo.</p>

  <div class="drop" id="drop">
    <p class="big">Arrastra tu pieza aquí</p>
    <p>o haz clic para seleccionar el archivo</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="result" id="result">
    <div class="result-tag" id="resultTag"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultBody"></p>
  </div>

  <footer>Cada pieza es válida una sola vez.</footer>
</div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');

drop.addEventListener('click', ()=> fileInput.click());
['dragover'].forEach(evt=> drop.addEventListener(evt, e=>{ e.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(evt=> drop.addEventListener(evt, e=>{ e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e=>{
  if(e.dataTransfer.files.length) handleUploadedFile(e.dataTransfer.files[0], onToken, onFail);
});
fileInput.addEventListener('change', e=>{
  if(e.target.files.length) handleUploadedFile(e.target.files[0], onToken, onFail);
});

function showResult({ok, title, body}){
  const box = document.getElementById('result');
  box.className = 'result show ' + (ok ? 'ok' : 'err');
  document.getElementById('resultTag').textContent = ok ? 'Acceso concedido' : 'Acceso rechazado';
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultBody').textContent = body;
}

function onFail(){
  showResult({ok:false, title:'No se pudo leer la pieza', body:'La imagen no contiene un código válido o la foto está borrosa.'});
}

async function onToken(token){
  const res = await redeemToken(token);
  if(!res.ok){
    if(res.reason === 'not_found'){
      showResult({ok:false, title:'Pieza no reconocida', body:'El código leído no corresponde a ninguna pieza emitida.'});
    } else if(res.reason === 'used'){
      showResult({ok:false, title:'Esta pieza ya fue utilizada', body:'Cada pieza da acceso una sola vez. El folio de ' + res.name + ' ya fue canjeado.'});
    } else {
      showResult({ok:false, title:'Error al validar', body:'No se pudo consultar la base. Intenta de nuevo.'});
    }
    return;
  }
  showResult({ok:true, title:'¡Bienvenido, ' + res.name + '!', body:'Redirigiendo a tu perfil…'});
  setTimeout(()=>{
    window.location.href = 'destino.html?nombre=' + encodeURIComponent(res.name);
  }, 900);
}
</script>
</body>
</html>
