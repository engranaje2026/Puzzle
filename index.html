<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Sinergia</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .drop {
    border: 2px dashed #3a4568;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    background: #131b2e;
    cursor: pointer;
    margin: 20px 0;
  }
  .result {
    display: none;
    padding: 16px;
    border-radius: 8px;
    margin-top: 20px;
    text-align: center;
  }
  .result.show { display: block; }
  .result.ok { background: #142918; border: 1px solid #205a28; color: #51cf66; }
  .result.err { background: #2a1515; border: 1px solid #5a2020; color: #ff6b6b; }
  .result.loading { background: #1a2440; border: 1px solid #3a4568; color: #c6a15b; }
  .result h2 { margin: 0 0 8px; font-size: 18px; color: inherit; }
  .result p { margin: 0; font-size: 14px; color: #ddd; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"> Sinergia</div>
  <h1>Sube tu pieza</h1>
  <p class="sub">Cada integrante recibió una pieza única. Súbela aquí para entrar al espacio del equipo.</p>

  <div class="drop" id="drop">
    <p class="big" style="font-weight:600; color:#fff; margin:0 0 6px;">Toca aquí para seleccionar tu pieza</p>
    <p style="color:#8a99ad; margin:0; font-size:13px;">Formatos: PNG o JPG</p>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
  </div>

  <div class="result" id="result">
    <h2 id="resultTitle"></h2>
    <p id="resultBody"></p>
  </div>

  <footer>Cada pieza es válida una sola vez.</footer>
</div>

<script>
const SUPABASE_URL = 'https://ngukwfgiyrsxloicixhx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ndWt3ZmdpeXJzeGxvaWNpeGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTQwMTcsImV4cCI6MjEwMjUzMDAxN30.rDnMh6dEPirrm8TVQLaii9Nunr1xVYD9jTQ8Z60MDBs';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');

drop.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files.length > 0) {
    handleUploadedFile(e.target.files[0]);
  }
});

function showResult(type, title, body) {
  const box = document.getElementById('result');
  box.className = 'result show ' + type;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultBody').textContent = body;
}

function handleUploadedFile(file) {
  showResult('loading', 'Analizando pieza...', 'Leyendo el código QR embebido en la imagen.');
  
  const img = new Image();
  const reader = new FileReader();

  reader.onload = (e) => {
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        if (typeof jsQR === 'undefined') {
          showResult('err', 'Error interno', 'La librería de lectura QR no cargó correctamente.');
          return;
        }

        const code = jsQR(imgData.data, canvas.width, canvas.height, {
          inversionAttempts: "dontInvert",
        });

        if (code && code.data) {
          validateToken(code.data.trim());
        } else {
          showResult('err', 'No se pudo leer la pieza', 'Asegúrate de subir la imagen original PNG descargada del generador.');
        }
      } catch (err) {
        showResult('err', 'Error al procesar', 'No se pudo decodificar el archivo.');
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function validateToken(token) {
  showResult('loading', 'Validando con el servidor...', 'Verificando autenticidad del folio.');

  try {
    const { data, error } = await supabaseClient
      .from('pieces')
      .update({ used: true, used_at: new Date().toISOString() })
      .eq('token', token)
      .eq('used', false)
      .select();

    if (error) {
      showResult('err', 'Error de conexión', error.message);
      return;
    }

    if (!data || data.length === 0) {
      const { data: existing } = await supabaseClient
        .from('pieces')
        .select('*')
        .eq('token', token)
        .maybeSingle();

      if (!existing) {
        showResult('err', 'Pieza no reconocida', 'El código de esta pieza no está registrado en el sistema.');
      } else {
        showResult('err', 'Pieza ya utilizada', 'Esta pieza (' + existing.name + ') ya fue canjeada anteriormente.');
      }
      return;
    }

    const name = data[0].name;
    showResult('ok', '¡Bienvenido/a, ' + name + '!', 'Acceso concedido. Redirigiendo...');
    
    setTimeout(() => {
      window.location.href = 'destino.html?nombre=' + encodeURIComponent(name);
    }, 1000);

  } catch (err) {
    showResult('err', 'Error de red', 'No se pudo completar la verificación.');
  }
}
</script>
</body>
</html>
