<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenida — Planilla Sinergia</title>
<link rel="stylesheet" href="styles.css">
<style>
  .welcome-card {
    background: #131b2e;
    border: 1px solid #3a4568;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    margin-top: 25px;
  }
  .gear-icon {
    font-size: 48px;
    margin-bottom: 10px;
  }
  .highlight {
    color: #c6a15b;
    font-size: 26px;
    font-weight: 700;
    margin: 15px 0;
    letter-spacing: 0.5px;
  }
  .desc {
    color: #e0e0e0;
    font-size: 15px;
    line-height: 1.6;
    max-width: 320px;
    margin: 0 auto;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Acceso Confirmado</div>
  <h1>Engranaje Completo</h1>

  <div class="welcome-card">
    <div class="gear-icon">⚙️</div>
    <p style="color: #8a99ad; margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Bienvenido/a al equipo</p>
    <div class="highlight" id="userName">Integrante</div>
    <p class="desc">
      Tu pieza ha sido validada con éxito y ensamblada a la maquinaria de <b>Planilla Sinergia</b>.
    </p>
  </div>

  <footer>Planilla Sinergia — Juntos avanzamos</footer>
</div>

<script>
  // Obtiene el nombre del integrante desde el parámetro URL ?nombre=...
  const params = new URLSearchParams(window.location.search);
  const name = params.get('nombre');
  if (name) {
    document.getElementById('userName').textContent = decodeURIComponent(name);
  }
</script>
</body>
</html>
