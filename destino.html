<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenido — Planilla Sinergia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="destino-box">
    <svg class="gear" style="width:260px;height:260px;top:-60px;left:-60px" viewBox="0 0 100 100"><path fill="#c6a15b" d="M50 10 L55 20 L65 18 L67 28 L77 30 L75 40 L85 45 L80 54 L88 60 L80 66 L85 75 L75 77 L77 87 L67 85 L65 95 L55 90 L50 100 L45 90 L35 95 L33 85 L23 87 L25 77 L15 75 L20 66 L12 60 L20 54 L15 45 L25 40 L23 30 L33 28 L35 18 L45 20 Z"/></svg>
    <svg class="gear rev" style="width:180px;height:180px;bottom:-40px;right:-40px" viewBox="0 0 100 100"><path fill="#c6a15b" d="M50 10 L55 20 L65 18 L67 28 L77 30 L75 40 L85 45 L80 54 L88 60 L80 66 L85 75 L75 77 L77 87 L67 85 L65 95 L55 90 L50 100 L45 90 L35 95 L33 85 L23 87 L25 77 L15 75 L20 66 L12 60 L20 54 L15 45 L25 40 L23 30 L33 28 L35 18 L45 20 Z"/></svg>
    <div class="destino-content">
      <div class="destino-eyebrow">Acceso confirmado</div>
      <h2 id="destinoName">Bienvenido</h2>
      <p>Este es el espacio del equipo. Aquí vive lo que solo la planilla puede ver.</p>
      <div class="destino-card">
        <div class="k">Agenda</div>
        <div class="v">Próxima reunión de coordinación — por definir</div>
      </div>
      <div class="destino-card">
        <div class="k">Estado del acceso</div>
        <div class="v" id="destinoMeta">Folio validado y marcado como usado</div>
      </div>
      <div class="exit-note">Este acceso ya no puede volver a usarse.</div>
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const name = params.get('nombre') || 'integrante';
document.getElementById('destinoName').textContent = 'Bienvenido, ' + name;
document.getElementById('destinoMeta').textContent = 'Folio de ' + name + ' validado y marcado como usado';
</script>
</body>
</html>
