<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienvenidos a —Sinergia</title>
<link rel="stylesheet" href="styles.css">
<style>
  .welcome-card {
    background: #131b2e;
    border: 1px solid #3a4568;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    margin-top: 25px;
  }
  .gear-icon {
    font-size: 48px;
    margin-bottom: 10px;
  }
  .highlight {
    color: #c6a15b;
    font-size: 26px;
    font-weight: 700;
    margin: 15px 0;
    letter-spacing: 0.5px;
  }
  .desc {
    color: #e0e0e0;
    font-size: 15px;
    line-height: 1.6;
    max-width: 320px;
    margin: 0 auto;
  }
</style>
</head>
<body>
<div class="wrap" id="mainContent" style="display:none;">
  <div class="eyebrow">Acceso Confirmado</div>
  <h1>Engranaje Completo</h1>

  <div class="welcome-card">
    <div class="gear-icon">⚙️</div>
    <p style="color: #8a99ad; margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Bienvenido/a al equipo</p>
    <div class="highlight" id="userName">Integrante</div>
    <p class="desc">
      Tu eres la pieza que hace que la maquina se mueva, bienvenidos a Sinergia <b> Nuestra proxima reunión se llevará a cabo el dia jueves 20 de agosto de 2026
        en: <a href="https://maps.app.goo.gl/u1ZT3uVz75RCAS7H8"> Cafeteria Bondi </a> </b>.
    </p>
  </div>

  <footer>Sinergia — Juntos avanzamos</footer>
</div>

<script>
  // 1. Verificar si el usuario pasó por la validación del QR
  const isAuth = sessionStorage.getItem('sinergia_auth');
  const userName = sessionStorage.getItem('sinergia_user');

  if (!isAuth || !userName) {
    // Si entró directo sin escanear, lo redirige al validador de inmediato
    alert('Acceso no autorizado. Debes escanear tu pieza para ingresar.');
    window.location.replace('index.html');
  } else {
    // Si está validado, mostramos el contenido y su nombre
    document.getElementById('userName').textContent = userName;
    document.getElementById('mainContent').style.display = 'block';
  }
</script>
</body>
</html>
