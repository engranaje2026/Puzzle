<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador — Planilla Sinergia</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Solo para ti — no compartas esta URL</div>
  <h1>Generador de piezas</h1>
  <p class="sub">Genera una pieza por integrante. Descárgala y envíasela por su cuenta.</p>

  <div class="section-title">Nueva pieza</div>
  <div class="row">
    <input type="text" id="nameInput" placeholder="Nombre del integrante">
    <button class="btn primary" id="genBtn">Generar pieza</button>
  </div>

  <div class="section-title">Piezas generadas</div>
  <div class="pieces" id="pieces"><div class="empty">Cargando piezas…</div></div>

  <footer><a class="plain" href="index.html">Ir a la página de verificación</a></footer>
</div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script>
const piecesEl = document.getElementById('pieces');
const nameInput = document.getElementById('nameInput');
const genBtn = document.getElementById('genBtn');

async function renderPieces(){
  const tokens = await loadTokens();
  piecesEl.innerHTML = '';
  if(!tokens.length){
    piecesEl.innerHTML = '<div class="empty">Aún no hay piezas generadas.</div>';
    return;
  }
  tokens.forEach((entry, i)=>{
    const card = document.createElement('div');
    card.className = 'piece-card' + (entry.used ? ' used' : '');
    const canvas = document.createElement('canvas');
    drawGearPiece(canvas, entry.token, 'PIEZA #' + (i+1));
    card.appendChild(canvas);

    const name = document.createElement('div');
    name.className = 'piece-name';
    name.textContent = entry.name;
    card.appendChild(name);

    const status = document.createElement('div');
    status.className = 'piece-status';
    status.textContent = entry.used ? 'Ya utilizada' : 'Disponible';
    card.appendChild(status);

    if(entry.used){
      const detail = document.createElement('div');
      detail.style.textAlign = 'left';
      detail.style.fontSize = '12px';
      detail.style.color = '#8792a8';
      detail.style.margin = '4px 0 10px';
      detail.innerHTML =
        '<div style="margin-bottom:4px;"><strong style="color:#c9ced9;">Cartera:</strong> ' + (entry.cartera || '—') + '</div>' +
        '<div><strong style="color:#c9ced9;">Propuesta:</strong> ' + (entry.propuesta ? entry.propuesta.slice(0,140) + (entry.propuesta.length>140?'…':'') : '—') + '</div>';
      card.appendChild(detail);

      const fbTextarea = document.createElement('textarea');
      fbTextarea.placeholder = 'Retroalimentación para ' + entry.name;
      fbTextarea.value = entry.feedback || '';
      fbTextarea.style.width = '100%';
      fbTextarea.style.minHeight = '70px';
      fbTextarea.style.fontSize = '12.5px';
      fbTextarea.style.padding = '8px';
      fbTextarea.style.borderRadius = '8px';
      fbTextarea.style.background = '#070a12';
      fbTextarea.style.border = '1px solid #232c42';
      fbTextarea.style.color = '#c9ced9';
      fbTextarea.style.marginBottom = '8px';
      fbTextarea.style.resize = 'vertical';
      card.appendChild(fbTextarea);

      const fbBtn = document.createElement('button');
      fbBtn.className = 'btn small';
      fbBtn.textContent = 'Guardar retroalimentación';
      fbBtn.onclick = async ()=>{
        fbBtn.disabled = true;
        fbBtn.textContent = 'Guardando…';
        const { error } = await supabase
          .from('pieces')
          .update({ feedback: fbTextarea.value.trim(), feedback_date: new Date().toISOString() })
          .eq('token', entry.token);
        fbBtn.textContent = error ? 'Error — reintentar' : 'Guardado ✓';
        fbBtn.disabled = false;
      };
      card.appendChild(fbBtn);
    }

    const dl = document.createElement('a');
    dl.className = 'btn small';
    dl.textContent = 'Descargar';
    dl.href = '#';
    dl.onclick = (e)=>{
      e.preventDefault();
      dl.href = canvas.toDataURL('image/png');
      dl.download = entry.name.replace(/\s+/g,'-').toLowerCase() + '.png';
      dl.click();
    };
    if(entry.used) dl.setAttribute('disabled','true');
    card.appendChild(dl);

    piecesEl.appendChild(card);
  });
}

genBtn.addEventListener('click', async ()=>{
  const name = nameInput.value.trim();
  if(!name) return;
  genBtn.disabled = true;
  const token = 'PZ-' + crypto.randomUUID().slice(0,8).toUpperCase();
  await insertPiece(name, token);
  nameInput.value = '';
  await renderPieces();
  genBtn.disabled = false;
});

renderPieces();
</script>
</body>
</html>
