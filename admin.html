<script src="config.js"></script>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  const box = document.getElementById('pieces');
  const btn = document.getElementById('genBtn');
  const input = document.getElementById('nameInput');

  // 1. Validar variables de entorno
  if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
    box.innerHTML = '<div style="color:#ff6b6b; padding:15px; background:#2a1515; border-radius:8px;">❌ <b>Error:</b> config.js no definió SUPABASE_URL o SUPABASE_ANON_KEY.</div>';
    return;
  }

  if (typeof window.supabase === 'undefined') {
    box.innerHTML = '<div style="color:#ff6b6b; padding:15px; background:#2a1515; border-radius:8px;">❌ <b>Error:</b> La librería CDN de Supabase no cargó en el navegador.</div>';
    return;
  }

  // 2. Inicializar cliente
  const url = SUPABASE_URL.replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
  const client = window.supabase.createClient(url, SUPABASE_ANON_KEY);

  box.innerHTML = '<div style="color:#e0e0e0;">Conectando con Supabase...</div>';

  // 3. Probar lectura
  const { data, error } = await client.from('pieces').select('*').order('created_at', { ascending: true });

  if (error) {
    box.innerHTML = `<div style="color:#ff6b6b; padding:15px; background:#2a1515; border-radius:8px;">
      ❌ <b>Error de Supabase:</b> ${error.message}<br>
      <small style="color:#bbb;">Código: ${error.code || 'N/A'} — Detalles: ${error.details || 'Ninguno'}</small>
    </div>`;
    return;
  }

  box.innerHTML = `<div style="color:#51cf66; padding:10px; background:#142918; border-radius:8px; margin-bottom:15px;">
    ✅ Conexión exitosa. Filas en base de datos: ${data.length}
  </div>`;

  if (data.length === 0) {
    box.innerHTML += '<div class="empty">Aún no hay piezas registradas en la tabla.</div>';
  } else {
    data.forEach((p, idx) => {
      box.innerHTML += `<div style="padding:10px; border:1px solid #3a4568; margin-top:8px; border-radius:6px;">
        <b>#${idx + 1} - ${p.name}</b> [Token: ${p.token}] — <i>${p.used ? 'Ya usada' : 'Disponible'}</i>
      </div>`;
    });
  }

  // 4. Probar botón de inserción
  btn.onclick = async () => {
    const val = input.value.trim();
    if (!val) return alert('Escribe un nombre');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const testToken = 'PZ-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    const { error: insErr } = await client.from('pieces').insert({ name: val, token: testToken });

    if (insErr) {
      alert('Error al insertar: ' + insErr.message);
    } else {
      alert('¡Pieza guardada con éxito en Supabase!');
      location.reload();
    }
    btn.disabled = false;
    btn.textContent = 'Generar pieza';
  };
});
</script>
