<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador — Planilla Sinergia</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .empty { padding: 12px; color: #8a99ad; font-size: 14px; }
  .piece-card { background: #131b2e; border: 1px solid #2a3656; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .piece-name { font-weight: 600; color: #fff; }
  .piece-status { font-size: 12px; color: #c6a15b; }
  .piece-status.used { color: #888; }
  .actions { display: flex; gap: 8px; }
  .btn-delete { background: #5a2020; color: #ff8585; border: 1px solid #7a2828; }
  .btn-delete:hover { background: #7a2828; }
  
  /* Pantalla de bloqueo */
  #loginOverlay {
    position: fixed; inset: 0; background: #0c1120;
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .login-card {
    background: #131b2e; border: 1px solid #3a4568; border-radius: 12px;
    padding: 30px 24px; width: 90%; max-width: 360px; text-align: center;
  }
</style>
</head>
<body>

<!-- Pantalla de bloqueo por PIN -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="eyebrow">Panel Administrativo</div>
    <h2 style="color:#fff; margin: 10px 0 20px;">Ingresa el PIN</h2>
    <input type="password" id="pinInput" placeholder="Contraseña de acceso" style="width:100%; box-sizing:border-box; margin-bottom:12px; text-align:center;">
    <button class="btn primary" id="loginBtn" style="width:100%;">Entrar</button>
    <p id="loginError" style="color:#ff6b6b; font-size:13px; margin:12px 0 0; display:none;">PIN incorrecto.</p>
  </div>
</div>

<!-- Panel de Administración -->
<div class="wrap" id="adminWrap" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div class="eyebrow">Panel de Control</div>
    <button class="btn small" id="logoutBtn" style="background:#2a3656;">Cerrar sesión</button>
  </div>
  <h1>Generador de piezas</h1>
  <p class="sub">Genera una pieza por integrante. Descárgala y envíasela por su cuenta.</p>

  <div class="section-title">Nueva pieza</div>
  <div class="row">
    <input type="text" id="nameInput" placeholder="Nombre del integrante">
    <button class="btn primary" id="genBtn">Generar pieza</button>
  </div>

  <div class="section-title">Piezas generadas</div>
  <div class="pieces" id="pieces">
    <div class="empty" id="statusMsg">Cargando piezas...</div>
  </div>

  <footer><a class="plain" href="index.html">Ir a la página de verificación</a></footer>
</div>

<script>
// CONTRASEÑA DE ACCESO AL PANEL (Cámbiala por la que prefieras)
const ADMIN_PIN = 'Sinergya';

const loginOverlay = document.getElementById('loginOverlay');
const adminWrap = document.getElementById('adminWrap');
const pinInput = document.getElementById('pinInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');

// 1. Control de autenticación
function checkAuth() {
  if (sessionStorage.getItem('admin_logged') === 'true') {
    loginOverlay.style.display = 'none';
    adminWrap.style.display = 'block';
    initAdmin();
  }
}

loginBtn.onclick = () => {
  if (pinInput.value === ADMIN_PIN) {
    sessionStorage.setItem('admin_logged', 'true');
    loginOverlay.style.display = 'none';
    adminWrap.style.display = 'block';
    initAdmin();
  } else {
    loginError.style.display = 'block';
    pinInput.value = '';
    pinInput.focus();
  }
};

pinInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});

logoutBtn.onclick = () => {
  sessionStorage.removeItem('admin_logged');
  location.reload();
};

// 2. Conexión y lógica del panel
const SUPABASE_URL = 'https://ngukwfgiyrsxloicixhx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ndWt3ZmdpeXJzeGxvaWNpeGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTQwMTcsImV4cCI6MjEwMjUzMDAxN30.rDnMh6dEPirrm8TVQLaii9Nunr1xVYD9jTQ8Z60MDBs';

let supabaseClient = null;

function gearPath(cx, cy, rOuter, rInner, teeth) {
  let d = '';
  const step = (Math.PI * 2) / teeth;
  for (let i = 0; i < teeth; i++) {
    const a0 = i * step, a1 = a0 + step * 0.35, a2 = a0 + step * 0.5, a3 = a0 + step * 0.85;
    const pts = [
      [cx + rInner * Math.cos(a0), cy + rInner * Math.sin(a0)],
      [cx + rOuter * Math.cos(a1), cy + rOuter * Math.sin(a1)],
      [cx + rOuter * Math.cos(a2), cy + rOuter * Math.sin(a2)],
      [cx + rInner * Math.cos(a3), cy + rInner * Math.sin(a3)],
    ];
    pts.forEach((p, j) => { d += (i === 0 && j === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1) + ' '; });
  }
  return d + 'Z';
}

function drawGearPiece(canvas, token, label) {
  const ctx = canvas.getContext('2d');
  canvas.width = 240; canvas.height = 260;
  const cx = 120, cy = 110;
  const path = new Path2D(gearPath(cx, cy, 96, 80, 14));
  const grad = ctx.createLinearGradient(0, 0, 240, 220);
  grad.addColorStop(0, '#1a2440'); grad.addColorStop(1, '#0c1120');
  ctx.fillStyle = grad;
  ctx.fill(path);
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = '#3a4568';
  ctx.stroke(path);

  const host = document.createElement('div');
  host.style.display = 'none';
  document.body.appendChild(host);
  new QRCode(host, { text: token, width: 108, height: 108, colorDark: '#0c1120', colorLight: '#e9ebf1' });

  setTimeout(() => {
    const qrCanvas = host.querySelector('canvas');
    if (qrCanvas) {
      const white = document.createElement('canvas');
      white.width = 122; white.height = 122;
      const wctx = white.getContext('2d');
      wctx.fillStyle = '#eceef3';
      wctx.fillRect(0, 0, 122, 122);
      wctx.drawImage(qrCanvas, 7, 7, 108, 108);
      ctx.drawImage(white, cx - 61, cy - 61, 122, 122);
    }
    ctx.fillStyle = '#c6a15b';
    ctx.font = '600 11px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(label, cx, 245);
    host.remove();
  }, 50);
}

const piecesEl = document.getElementById('pieces');
const nameInput = document.getElementById('nameInput');
const genBtn = document.getElementById('genBtn');

async function renderPieces() {
  if (!supabaseClient) return;
  piecesEl.innerHTML = '<div class="empty">Cargando piezas...</div>';
  
  const { data, error } = await supabaseClient
    .from('pieces')
    .select('*')
    .order('created_at', { ascending: true });

  if (error) {
    piecesEl.innerHTML = `<div style="color:#ff6b6b; padding:10px;">Error al consultar: ${error.message}</div>`;
    return;
  }

  piecesEl.innerHTML = '';
  if (!data || !data.length) {
    piecesEl.innerHTML = '<div class="empty">Aún no hay piezas generadas.</div>';
    return;
  }

  data.forEach((entry, i) => {
    const card = document.createElement('div');
    card.className = 'piece-card' + (entry.used ? ' used' : '');
    
    const canvas = document.createElement('canvas');
    drawGearPiece(canvas, entry.token, 'PIEZA #' + (i + 1));
    card.appendChild(canvas);

    const info = document.createElement('div');
    info.innerHTML = `<div class="piece-name">${entry.name}</div><div class="piece-status ${entry.used ? 'used' : ''}">${entry.used ? 'Ya utilizada' : 'Disponible'}</div>`;
    card.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'actions';

    // Descargar
    const dl = document.createElement('button');
    dl.className = 'btn small';
    dl.textContent = 'Descargar';
    dl.onclick = () => {
      canvas.toBlob((blob) => {
        const fileName = entry.name.replace(/\s+/g, '-').toLowerCase() + '.png';
        if (!blob) {
          window.open(canvas.toDataURL('image/png'), '_blank');
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      }, 'image/png');
    };
    actions.appendChild(dl);

    // Eliminar
    const delBtn = document.createElement('button');
    delBtn.className = 'btn small btn-delete';
    delBtn.textContent = 'Eliminar';
    delBtn.onclick = async () => {
      if (!confirm(`¿Eliminar la pieza de "${entry.name}"?`)) return;
      delBtn.disabled = true;
      delBtn.textContent = '...';

      const { error: delErr } = await supabaseClient.from('pieces').delete().eq('token', entry.token);
      if (delErr) {
        alert('Error: ' + delErr.message);
        delBtn.disabled = false;
        delBtn.textContent = 'Eliminar';
      } else {
        await renderPieces();
      }
    };
    actions.appendChild(delBtn);

    card.appendChild(actions);
    piecesEl.appendChild(card);
  });
}

function initAdmin() {
  if (!supabaseClient) {
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      piecesEl.innerHTML = '<div style="color:red">Error al inicializar Supabase.</div>';
    }
  }

  genBtn.onclick = async () => {
    const name = nameInput.value.trim();
    if (!name) return alert('Escribe un nombre');
    
    genBtn.disabled = true;
    genBtn.textContent = 'Generando...';
    
    const token = 'PZ-' + Math.random().toString(36).substring(2, 9).toUpperCase();
    const { error } = await supabaseClient.from('pieces').insert({ token, name });
    
    if (error) {
      alert('Error al guardar: ' + error.message);
    } else {
      nameInput.value = '';
      await renderPieces();
    }
    
    genBtn.disabled = false;
    genBtn.textContent = 'Generar pieza';
  };

  renderPieces();
}

// Iniciar verificación
checkAuth();
</script>
</body>
</html>
